name: CI
on: [push, pull_request]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Apply validated connectome UI patches
        run: node scripts/patch-connectome-ui.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run race
      - name: Upload race diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connectome-race-replay
          path: data/races/latest.agpr.json
          if-no-files-found: error
      - run: npm run build
      - name: Upload browser preview
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: connectome-browser-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 30
      - name: Persist validated source patches
        if: github.event_name == 'push' && github.ref == 'refs/heads/connectome-world-championship'
        run: |
          git config user.name "AGP CI"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/src/ChampionshipApp.tsx
          if ! git diff --cached --quiet; then
            git commit -m "Persist validated championship UI source fix [skip ci]"
            git push origin HEAD:connectome-world-championship
          fi
      - name: Publish browser preview branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/connectome-world-championship'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: browser-preview
          publish_dir: ./apps/web/dist
          force_orphan: true
          commit_message: Publish tested Connectome World Championship browser build
